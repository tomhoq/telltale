# Run configuration. Everything here is meant to be swept without recompiling.
manifest-dir: methods/manifests

# Inactivity timeout for session assembly. When it fires, any method still
# waiting for its required stage reports a partial result or none — it never
# holds the session open.
session-timeout-secs: 30

# Worker threads. One job is one session; methods within a session run on one
# thread so the fusion method can read the others' evidence without locking.
workers: 8

# per-session    -> assemble the full session, then score once
# inference-time -> emit a best guess as data arrives, refine as more comes in
output: per-session
