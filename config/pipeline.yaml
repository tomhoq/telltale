# Run configuration. Everything here is meant to be swept without recompiling.
manifest-dir: methods/manifests

# Inactivity timeout for session assembly. When it fires, the session ends
# with whatever results it has — nothing waits for traffic that never came.
session-timeout-secs: 30

# Worker threads. One job is one method answering one trigger event, so
# several methods fired by the same packet run at once.
workers: 8

# per-session    -> batch: each session once it is finalized, with all its results
# inference-time -> each result the moment a method reports it
output: per-session
