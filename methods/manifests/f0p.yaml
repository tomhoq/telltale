name: f0p
description: >
  Passive TCP/IP stack fingerprinting (p0f-style: TTL, window, MSS, option
  order) from the SYN, matched against the real p0f fingerprint database.
  Refined with HTTP request features — User-Agent and header order — once
  the session sends one, the same way real p0f matches TCP and HTTP
  signatures out of one fingerprint file. The name is p0f spelled backwards:
  same database, our own (simplified) matcher.
enabled: true

# Satisfied by the very first packet, so this method effectively always runs.
required-stage: connect

invocation:
  # Every-observation, not just stage-reached: the SYN alone gives an
  # OS/stack guess, but a later HTTP request refines it, so this needs a
  # second look whenever the session grows.
  trigger: every-observation
  priority: 100
  budget-ms: 50

database:
  path: ../db/p0f.fp
  format: p0f

output:
  fields:
    - name: os
      description: Operating system family and version, from the TCP/IP stack signature.
    - name: stack
      description: TCP/IP stack, when it differs from the OS (raw-socket tools, scanners).
    - name: signature
      kind: raw-signature
      description: The observed SYN in p0f's raw_sig notation (ver:ittl:olen:mss:wsize,scale:olayout:quirks:pclass), for comparing against p0f and its database.
    - name: distance
      kind: raw-signature
      description: Estimated hop count, the gap between the observed TTL and the initial TTL it left with (the matched signature's when the TTL fits it, else the nearest of 32, 64, 128 or 255 above it).
    - name: client
      description: HTTP client/tool, from the header order. Strong on a specific signature, Likely on a generic one.
    - name: ua-conflict
      kind: flag
      description: Set when the User-Agent lacks the substring the matched HTTP signature expects (p0f's "dishonest"). Says the claim and the headers disagree, not which is right.

