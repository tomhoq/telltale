name: banner
description: >
  Client software identification from the HTTP User-Agent header, matched
  against known libraries, scanners, and research crawlers.
enabled: true

required-stage: app-data

invocation:
  trigger: stage-reached
  priority: 80
  budget-ms: 50

database:
  path: ../db/banners.yaml
  format: rules

output:
  fields:
    - name: client
      description: Identified tool or library, e.g. curl, sqlmap, Shodan.
    - name: category
      description: library | scanner | crawler | malformed
    - name: version
      description: Version string, when the matched pattern has one to extract.

params:
  # Never scan more than this much payload; a large transfer must not make the
  # method expensive.
  max-bytes: 4096
