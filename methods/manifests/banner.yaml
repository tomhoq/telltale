name: banner
description: >
  Client software identification from plaintext banners and request headers —
  SSH identification strings and HTTP User-Agents.
enabled: true
layer: L3

triggers: [ssh-banner, http-request]

invocation:
  type: in-process
  adapter: banner
  timeout-ms: 50

database:
  path: ../db/banners.yaml
  format: rules

output-schema:
  - field: protocol
    type: string
    kind: classification
    description: Where the banner came from, ssh or http.
  - field: client
    type: string
    kind: raw-signature
    description: The client software string as sent.

params:
  # Never scan more than this much payload; a large request must not make the
  # method expensive.
  max-bytes: 4096
