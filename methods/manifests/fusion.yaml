name: fusion
description: >
  Combines the other methods' results into an overall verdict. Reads the
  session's result list, not packets, and appends its own entry.
enabled: true
layer: L3

# Fires once every other method the session triggered has reported.
triggers: [session-end]

invocation:
  type: in-process
  adapter: fusion
  timeout-ms: 100

output-schema:
  - field: verdict
    type: string
    kind: classification
    description: scanner | unknown
  - field: score
    type: float
    kind: score
    description: Weighted evidence for "scanner", 0 to 1.
  - field: methods
    type: integer
    kind: score
    description: How many distinct methods reported on the session.

params:
  # Score at or above which the endpoint is called a scanner.
  threshold: 0.7
  # Per-signal weights. This block is the knob to sweep when tuning.
  weights:
    ja4-known-scanner: 0.6
    banner-known-tool: 0.5
    os-client-mismatch: 0.3
    no-app-data: 0.2
    session-abandoned: 0.2
