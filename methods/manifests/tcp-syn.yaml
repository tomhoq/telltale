name: tcp-syn
description: >
  p0f-style stack fingerprinting from the TCP SYN: initial TTL, window size and
  TCP option order. Needs only the first packet, which is often all a scanner
  sends.
enabled: true
layer: L1

# The client's SYN only. Adding tcp-syn-ack would fingerprint the honeypot's
# own stack. A full p0f method would also list http-request / http-response.
triggers: [tcp-syn]

invocation:
  type: in-process
  adapter: tcp-syn
  timeout-ms: 50

database:
  path: ../db/p0f.fp
  format: p0f

output-schema:
  - field: signature
    type: string
    kind: raw-signature
    description: initial-ttl:window:option-layout, e.g. 64:29200:mss,sok,ts,nop,ws
  - field: distance
    type: integer
    kind: score
    description: Estimated hop count, from the initial TTL.
  - field: os-family
    type: string
    kind: classification
    description: Stack family from the initial TTL, until the p0f database is loaded.

params:
  # Reject signature matches below this similarity.
  min-score: 0.8
